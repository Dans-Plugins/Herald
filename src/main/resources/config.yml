# Herald Configuration

# Discord Configuration (flagship feature)
discord:
  enabled: false       # Set to true to enable Discord notifications
  webhook-url: ""      # Discord webhook URL for the channel you want to send notifications to
  join-message: "⚔️ Hear ye, hear ye! **{player}** hath entered the realm of **{server}**! ⚔️"  # Supports {player} and {server} placeholders

# Email Configuration (optional)
# Email Recipients
# List of email addresses to notify when a player joins
email-recipients: []

# Herald config.yml
smtp:
  server: ""           # Your SMTP server address
  port: 587            # 587 for TLS, 25 for plain
  username: ""         # Leave empty for no authentication
  password: ""         # Leave empty for no authentication
  use-tls: true        # Set to true if using port 587

email:
  sender: ""           # The email address to send notifications from