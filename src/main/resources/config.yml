# Herald Configuration

# Email Recipients
# List of email addresses to notify when a player joins
email-recipients:
  - "admin@example.com"
  - "moderator@example.com"

# Herald config.yml
smtp:
  server: "mailserver"  # Or your server's IP address if Herald isn't on the same machine
  port: 25             # Or 587 if you want to use TLS
  username: ""         # Leave empty for no authentication
  password: ""         # Leave empty for no authentication
  use-tls: false       # Set to true if using port 587

email:
  sender: "minecraft@minecraft-mail.local"

# Discord Configuration
discord:
  enabled: false       # Set to true to enable Discord notifications
  webhook-url: ""      # Discord webhook URL for the channel you want to send notifications to